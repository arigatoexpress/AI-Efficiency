<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4D148C"/>
    </marker>
    <marker id="arrowGated" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1000" height="560" rx="14" fill="#f6f7f9"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#4D148C" font-size="20" font-weight="700">Logistics Intelligence System — ADK Forward Architecture</text>
  <text x="500" y="62" text-anchor="middle" fill="#64748b" font-size="12">Public-data, human-reviewed. Not an official FedEx system. Internal data stays governance-gated.</text>

  <!-- ===== Row 1: Public data -> Cloud Run app ===== -->

  <!-- Public data sources -->
  <rect x="40" y="100" width="240" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="160" y="128" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="700">Public Data Sources</text>
  <rect x="58" y="142" width="92" height="26" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="104" y="159" text-anchor="middle" fill="#0369a1" font-size="11">NWS Weather</text>
  <rect x="170" y="142" width="92" height="26" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="216" y="159" text-anchor="middle" fill="#0369a1" font-size="11">Open-Meteo</text>
  <rect x="58" y="176" width="92" height="26" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="104" y="193" text-anchor="middle" fill="#0369a1" font-size="11">USGS / Roads</text>
  <rect x="170" y="176" width="92" height="26" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="216" y="193" text-anchor="middle" fill="#0369a1" font-size="11">Public Airports</text>

  <!-- Arrow: public data -> app -->
  <line x1="280" y1="160" x2="372" y2="160" stroke="#4D148C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="326" y="151" text-anchor="middle" fill="#4D148C" font-size="10">public signals</text>

  <!-- Cloud Run app -->
  <rect x="375" y="100" width="250" height="120" rx="10" fill="#ffffff" stroke="#4D148C" stroke-width="2.5"/>
  <text x="500" y="126" text-anchor="middle" fill="#4D148C" font-size="14" font-weight="700">Cloud Run App</text>
  <text x="500" y="146" text-anchor="middle" fill="#64748b" font-size="11">React / Vite frontend</text>
  <text x="500" y="164" text-anchor="middle" fill="#64748b" font-size="11">Express + TypeScript API</text>
  <text x="500" y="182" text-anchor="middle" fill="#64748b" font-size="11">5-panel manager dashboard</text>
  <text x="500" y="202" text-anchor="middle" fill="#64748b" font-size="11">Secrets server-side only</text>

  <!-- Arrow: app -> agent -->
  <line x1="625" y1="160" x2="717" y2="160" stroke="#4D148C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="671" y="151" text-anchor="middle" fill="#4D148C" font-size="10">draft request</text>

  <!-- ADK Agent on Vertex AI -->
  <rect x="720" y="100" width="240" height="120" rx="10" fill="#fff4ec" stroke="#FF6600" stroke-width="2.5"/>
  <text x="840" y="126" text-anchor="middle" fill="#b34700" font-size="14" font-weight="700">Gemini via Vertex AI</text>
  <text x="840" y="146" text-anchor="middle" fill="#b34700" font-size="11">ADK agent on Agent Engine</text>
  <text x="840" y="166" text-anchor="middle" fill="#9a4a1a" font-size="11">"Draft a shift brief</text>
  <text x="840" y="182" text-anchor="middle" fill="#9a4a1a" font-size="11">from public signals"</text>
  <text x="840" y="202" text-anchor="middle" fill="#9a4a1a" font-size="11">Read-only public tools</text>

  <!-- Arrow: agent -> drafts (down) -->
  <line x1="840" y1="220" x2="840" y2="300" stroke="#4D148C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="852" y="265" text-anchor="start" fill="#4D148C" font-size="10">labeled draft</text>

  <!-- ===== Row 2: Manager drafts + Human review gate ===== -->

  <!-- Manager drafts -->
  <rect x="720" y="302" width="240" height="108" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="840" y="330" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="700">Manager Drafts</text>
  <text x="840" y="350" text-anchor="middle" fill="#64748b" font-size="11">Pre-shift huddle, handoff,</text>
  <text x="840" y="366" text-anchor="middle" fill="#64748b" font-size="11">after-action summary</text>
  <text x="840" y="388" text-anchor="middle" fill="#64748b" font-size="11">Local template fallback</text>

  <!-- Arrow: drafts -> human review (left) -->
  <line x1="720" y1="356" x2="628" y2="356" stroke="#4D148C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Human review GATE -->
  <rect x="375" y="302" width="250" height="108" rx="10" fill="#f4ecfa" stroke="#4D148C" stroke-width="3" stroke-dasharray="2,0"/>
  <text x="500" y="330" text-anchor="middle" fill="#4D148C" font-size="14" font-weight="700">Human Review Gate</text>
  <text x="500" y="352" text-anchor="middle" fill="#5b3a82" font-size="11">Manager verifies every draft</text>
  <text x="500" y="370" text-anchor="middle" fill="#5b3a82" font-size="11">"Needs manager verification"</text>
  <text x="500" y="392" text-anchor="middle" fill="#5b3a82" font-size="11">No auto-send · no auto-action</text>

  <!-- review badge -->
  <circle cx="397" cy="324" r="13" fill="#4D148C"/>
  <path d="M390,324 l4,4 l9,-9" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== Governance-gated / future boundary ===== -->

  <rect x="40" y="296" width="300" height="170" rx="12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6"/>
  <rect x="56" y="286" width="220" height="22" rx="6" fill="#f6f7f9"/>
  <text x="166" y="302" text-anchor="middle" fill="#64748b" font-size="11" font-weight="700">GOVERNANCE-GATED · FUTURE</text>

  <!-- Arrow: human review -> gated Foundry (dashed, gated) -->
  <line x1="375" y1="356" x2="300" y2="356" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowGated)"/>
  <text x="337" y="347" text-anchor="middle" fill="#94a3b8" font-size="9">if approved</text>

  <!-- Foundry (gated) -->
  <rect x="70" y="330" width="240" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="190" y="354" text-anchor="middle" fill="#475569" font-size="13" font-weight="700">Palantir Foundry</text>
  <text x="190" y="372" text-anchor="middle" fill="#94a3b8" font-size="10">Governed internal data — gated</text>

  <text x="166" y="408" text-anchor="middle" fill="#94a3b8" font-size="10">Provenance-checked export packets first.</text>
  <text x="166" y="424" text-anchor="middle" fill="#94a3b8" font-size="10">Dry-run blocked until dataset RIDs +</text>
  <text x="166" y="440" text-anchor="middle" fill="#94a3b8" font-size="10">FedEx governance approval.</text>
  <text x="166" y="456" text-anchor="middle" fill="#94a3b8" font-size="10">No internal package/route/customer data.</text>

  <!-- ===== Legend ===== -->
  <rect x="40" y="492" width="920" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="60" y="508" width="20" height="14" rx="3" fill="#ffffff" stroke="#4D148C" stroke-width="2.5"/>
  <text x="88" y="519" fill="#475569" font-size="11">App / our code</text>

  <rect x="210" y="508" width="20" height="14" rx="3" fill="#fff4ec" stroke="#FF6600" stroke-width="2.5"/>
  <text x="238" y="519" fill="#475569" font-size="11">Gemini / ADK agent (Vertex AI)</text>

  <rect x="450" y="508" width="20" height="14" rx="3" fill="#f4ecfa" stroke="#4D148C" stroke-width="2.5"/>
  <text x="478" y="519" fill="#475569" font-size="11">Human review gate</text>

  <rect x="620" y="508" width="20" height="14" rx="3" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="648" y="519" fill="#475569" font-size="11">Governance-gated / future</text>

  <line x1="820" y1="515" x2="855" y2="515" stroke="#4D148C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="863" y="519" fill="#475569" font-size="11">Data / agent flow</text>
</svg>
